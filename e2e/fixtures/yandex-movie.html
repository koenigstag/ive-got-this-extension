<!doctype html>
<!--
  Synthetic Yandex results page for a film, modelled on yandex.ru as of November 2026:
  the film header across the top (EntityHeader + EntitySearchTiles_type_film) and the
  facts card (EntityCard_film, no header of its own) in the right column.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>matrix 1999 — Яндекс: нашлось 26 тыс. результатов</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff;
      }
      .content {
        display: flex;
        gap: 32px;
        padding: 0 32px;
      }
      .content__left {
        width: 640px;
      }
      .content__right {
        width: 460px;
      }
      .serp-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .serp-item {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body class="b-page b-page_ajax_yes">
    <main class="main">
      <div class="main__center">
        <div class="main__top">
          <div class="main__carousel">
            <div class="main__carousel-item main__carousel-item_type_entity_header">
              <div class="serp-item serp-item__entity-header" data-fast-name="entity_header">
                <div class="Root Root_inited">
                  <div class="EntityHeader EntityHeader_hasTiles EntityHeader_isMovieRedesign">
                    <div class="EntityHeader-Content">
                      <div class="EntityHeader-Entity">
                        <div class="EntityHeader-Description">
                          <div
                            class="EntityHeader-Title EntityHeader-Title_oneLine"
                            title="Матрица"
                          >
                            Матрица
                          </div>
                          <div
                            class="EntityHeader-Subtitle Typo Typo_text_c"
                            title="1999, фантастика, США, 136 мин, 18+"
                          >
                            <div class="EntityHeader-SubtitleText">
                              1999, фантастика, США, 136 мин, 18+
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="main__carousel-item main__carousel-item_type_entity_tiles">
              <div class="serp-item serp-item__entity-tiles" data-fast-name="entity_tiles">
                <div class="Root Root_inited">
                  <div
                    class="EntitySearchTiles EntitySearchTiles_cols_52 EntitySearchTiles_rows_7 EntitySearchTiles_type_film"
                  >
                    <div class="Tile">Трейлер</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="main__content">
          <div class="content">
            <div class="content__left">
              <ul id="search-result" class="serp-list serp-list_left_yes">
                <li class="serp-item">
                  <a href="https://www.kinopoisk.ru/film/301/">Матрица (1999) — Кинопоиск</a>
                </li>
                <li class="serp-item">
                  <a href="https://ru.wikipedia.org/wiki/Матрица_(фильм)"
                    >Матрица (фильм) — Википедия</a
                  >
                </li>
              </ul>
            </div>
            <div id="search-result-aside" class="content__right content__right_cols_12">
              <div class="serp-list serp-list_right_yes serp-list_complementary_yes">
                <div
                  class="serp-item card__narrow serp-item_card serp-item_card-has-shadow"
                  data-fast-name="entity_search"
                >
                  <div
                    class="EntityCard EntityCard_headless EntityCard_film"
                    role="region"
                    aria-label="Подробная информация"
                  >
                    <div class="EntityCardItem EntityCard-Item">
                      <h2 class="SnippetTitle EntityCardItem-Title">
                        <span class="SnippetTitle-Text">Факты</span>
                      </h2>
                      <ul class="KeyValue">
                        <li class="KeyValue-Row">
                          <div class="KeyValue-ItemTitle">Жанр :</div>
                          <div class="KeyValue-ItemValue">фантастика, боевик</div>
                        </li>
                        <li class="KeyValue-Row">
                          <div class="KeyValue-ItemTitle">Страны :</div>
                          <div class="KeyValue-ItemValue">США, Австралия</div>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
